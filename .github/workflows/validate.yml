name: Validate catalog

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install BitTorrent validation backend
        run: sudo apt-get update && sudo apt-get install -y aria2
      - run: pip install check-jsonschema==0.33.3
      - name: Validate each snapshot with its declared schema
        run: |
          for snapshot in docs/snapshots/catalog-*.json; do
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["schemaVersion"])' "$snapshot")
            check-jsonschema --schemafile "docs/schemas/catalog-v${version}.schema.json" "$snapshot"
          done
      - run: check-jsonschema --schemafile docs/schemas/head-v1.schema.json docs/head.json
      - name: Validate Publisher submissions
        run: |
          shopt -s nullglob globstar
          submissions=(submissions/**/submission.json)
          if ((${#submissions[@]})); then
            check-jsonschema --schemafile schemas/publisher-submission-v1.schema.json "${submissions[@]}"
            python3 tools/validate-submissions.py --fetch-missing --download-timeout 900 "${submissions[@]}"
          fi
