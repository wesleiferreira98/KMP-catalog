name: Publish signed catalog

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "seed-nodes.json"
  workflow_dispatch:
    inputs:
      sequence:
        description: Existing sequence to sign; leave empty to promote merged submissions
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: catalog-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: github.event_name == 'push' || inputs.sequence == ''
        with:
          go-version: "1.24.x"
          cache-dependency-path: tools/kmp-torrentd/go.sum
      - name: Build KMP torrent backend
        if: github.event_name == 'push' || inputs.sequence == ''
        run: cd tools/kmp-torrentd && go build -o "$RUNNER_TEMP/kmp-torrentd" ./cmd/kmp-torrentd
      - name: Revalidate package bytes from the swarm
        if: github.event_name == 'push' || inputs.sequence == ''
        env:
          KMP_TORRENTD: ${{ runner.temp }}/kmp-torrentd
        run: |
          shopt -s nullglob globstar
          submissions=(submissions/**/submission.json)
          if ((${#submissions[@]})); then
            python3 tools/validate-submissions.py --fetch-missing --download-timeout 900 "${submissions[@]}"
          fi
      - name: Promote merged submissions
        id: promote
        if: github.event_name == 'push' || inputs.sequence == ''
        run: python3 tools/promote-submissions.py --output "$GITHUB_OUTPUT"
      - name: Select sequence
        id: release
        env:
          REQUESTED_SEQUENCE: ${{ inputs.sequence }}
          PROMOTED_SEQUENCE: ${{ steps.promote.outputs.sequence }}
        run: |
          sequence="${REQUESTED_SEQUENCE:-$PROMOTED_SEQUENCE}"
          test -n "$sequence" || { echo "Nenhuma submissão pendente."; exit 0; }
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
      - name: Materialize protected signing key
        if: steps.release.outputs.sequence != ''
        env:
          SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.CATALOG_SIGNING_PASSPHRASE }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSPHRASE"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/catalog-key.pem"
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/catalog-passphrase"
      - name: Verify signing identity
        if: steps.release.outputs.sequence != ''
        run: |
          openssl pkey -in "$RUNNER_TEMP/catalog-key.pem" \
            -passin "file:$RUNNER_TEMP/catalog-passphrase" -pubout \
            -out "$RUNNER_TEMP/catalog-root.pub"
          cmp "$RUNNER_TEMP/catalog-root.pub" schemas/catalog-root.pub
      - name: Sign snapshot and head
        if: steps.release.outputs.sequence != ''
        env:
          SEQUENCE: ${{ steps.release.outputs.sequence }}
        run: |
          number=$(printf '%08d' "$SEQUENCE")
          snapshot="docs/snapshots/catalog-$number.json"
          torrent="docs/snapshots/catalog-$number.torrent"
          magnet=$(cat "docs/snapshots/catalog-$number.magnet")
          python3 tools/catalog-release.py "$snapshot" \
            --private-key "$RUNNER_TEMP/catalog-key.pem" \
            --passphrase-file "$RUNNER_TEMP/catalog-passphrase" \
            --torrent "$torrent" --magnet "$magnet" \
            --output "$RUNNER_TEMP/signed"
          cp "$RUNNER_TEMP/signed/catalog-$number.json.sig" "docs/snapshots/catalog-$number.json.sig"
          cp "$RUNNER_TEMP/signed/head.json" docs/head.json
          cp "$RUNNER_TEMP/signed/head.json.sig" docs/head.json.sig
      - name: Commit signed publication
        if: steps.release.outputs.sequence != ''
        env:
          SEQUENCE: ${{ steps.release.outputs.sequence }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          paths="docs/ reviews/"
          # Uma publicação só de nós públicos não tem submissões; sem nada rastreado
          # em submissions/, o pathspec abortaria o commit.
          if [ -n "$(git ls-files submissions)" ] || [ -d submissions ]; then paths="$paths submissions/"; fi
          git add -A $paths
          git commit -m "Publish signed catalog sequence $SEQUENCE"
          git push
